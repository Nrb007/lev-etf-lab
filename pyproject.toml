[project]
name = "lev-etf-lab"
version = "0.0.0"
description = "Hypothesis-driven research system for leveraged tech ETF holding-period signals."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pandas-market-calendars>=5.4.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "yfinance>=1.7.0",
]

[project.scripts]
lab = "core.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "hypotheses"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
