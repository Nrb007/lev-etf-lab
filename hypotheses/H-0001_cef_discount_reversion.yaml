id: H-0001
title: ADX discount reversion
mechanism: >
  A closed-end fund's market price can differ from the value of the portfolio it holds (its NAV),
  and the gap is set by investor demand rather than by the portfolio. Adams Diversified Equity Fund
  (ADX) is an equity fund that has traded at a discount to NAV on every day of the data checked
  (2005 onward). When
  that discount is unusually wide compared with its own recent range, the price is cheap relative to
  the assets behind it; arbitrage-limited buyers (activists, discount-tightening events, buy-ins
  by the fund) and the gap's own tendency to return to its typical level should pull the price up
  faster than NAV, so the forward return of the share should exceed that of the portfolio. The
  signal holds the fund when the prior day's discount is at least entry_z standard deviations
  wider than its trailing mean over window sessions, and holds cash otherwise. It is the theory
  of SPEC Section 15's closed-end funds paragraph, in a different asset class from the leveraged
  ETF theory, to show the engine and judge do not depend on one theory. It makes no claim
  about leveraged funds.
universe:
  fund: ADX
  research_universe: real
  leverage: 1
  features: {raw_close: "PX:ADX", nav: "NAV:ADX"}
signal_module: theories/cef/signals/premium_reversion.py
params:
  window: {values: [63, 126, 252]}
  entry_z: {values: [0.5, 1.0, 1.5]}
benchmark: buy_and_hold
primary_metric: sharpe
registered_at: 2026-10-03
notes_on_prior_trials: >
  None. No hypothesis has been run on the real ledger (N = 0). The fund's premium and discount were
  looked at once, over its full available history (1999 to October 2026, so including dates after
  the hold-out start), only to check that the NAV data is plausible: mean discount about 14%,
  standard deviation about 2 to 3 points, a discount on every day since 2005. No returns, signal
  values or backtests were computed then, and the window and threshold values were not chosen from
  that look.
