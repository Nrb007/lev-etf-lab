id: H-0002
title: ADX discount reversion
mechanism: >
  A closed-end fund's market price can differ from the value of the portfolio it holds (its NAV),
  and the gap is set by investor demand rather than by the portfolio. When the discount is
  unusually wide compared with the fund's own recent range, the price is cheap relative to the
  assets behind it; arbitrage-limited buyers (activists, discount-tightening events, buy-ins by the
  fund) and the gap's own tendency to return to its typical level should pull the price up faster
  than NAV, so the forward return of the share should exceed that of the portfolio. The signal
  holds the fund when the discount measured at the close of day t is at least entry_z standard
  deviations wider than its trailing mean over window sessions ending on t, and holds cash
  otherwise; the engine's t-to-t+1 lag is the only lag. The NAV for day t is in practice published
  after the close, so using it at the close of t is a small timing idealization that follows SPEC
  Section 5 exactly. This is the theory of SPEC Section 15's closed-end funds paragraph, in a
  different asset class from the leveraged ETF theory, to show the engine and judge do not depend on
  one theory; it makes no claim about leveraged funds. ADX (Adams Diversified Equity Fund, a plain
  large-cap equity fund) was chosen because it was the fund whose daily NAV source was verified
  (docs/decisions.md), not because of anything about its premium history.
  Grid values come from the mechanism alone. window is the trailing range the discount is judged
  against: one trading year (252 sessions) is a full annual cycle of the events that move discounts
  (distribution and tax-loss seasonality, annual-meeting and tender-offer calendars), and half a
  year (126) and two years (504) are its half and double, to see whether the result depends on
  that horizon. entry_z is the strength of the deviation, stated in standard deviations: 1.0 is the
  conventional "one sigma" level, 1.5 and 2.0 ask for rarer and wider discounts, which the
  mechanism says should revert more but leave the fund in cash more often.
universe:
  fund: ADX
  research_universe: real
  leverage: 1
  features: {raw_close: "PX:ADX", nav: "NAV:ADX"}
signal_module: theories/cef/signals/discount_zscore.py
params:
  window: {values: [126, 252, 504]}
  entry_z: {values: [1.0, 1.5, 2.0]}
benchmark: buy_and_hold
primary_metric: sharpe
registered_at: 2026-10-03
notes_on_prior_trials: >
  None. No hypothesis has been run on the real ledger (N = 0). An earlier draft of this hypothesis
  (H-0001, never run and never used; its id stays unused) was written after the ADX premium and
  discount had been looked at over the fund's full available history, including dates after the
  hold-out start, as summary statistics only and with no returns, signal values or backtests. The
  captain discarded that draft for this reason. This spec was written afresh from the mechanism
  argument alone, and that look did not inform it: the window and entry_z grids, the fund and the
  signal definition are justified above without reference to any premium or discount data.
