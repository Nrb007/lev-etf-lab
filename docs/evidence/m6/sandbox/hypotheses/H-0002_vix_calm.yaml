id: H-0002
title: Hold while implied volatility is calm (demo)
mechanism: >
  Volatility drag on a daily-reset 3x fund grows with realized variance, and realized variance
  clusters, so a low smoothed VIX predicts a low-drag, higher-return holding period. Hold the fund
  while the smoothed VIX is below a level, else sit in cash. In the simulated demo universe the
  VIX is independent of returns, so this mechanism has nothing to find there and the hypothesis is
  expected to fail.
universe: {fund: TQQQ, underlying: QQQ, research_universe: real}
signal_module: hypotheses/signals/h0002_vix_calm.py
params:
  window: {values: [1, 2, 3, 5, 8, 13, 21, 34]}
  vix_max: {values: [16, 18, 20, 22, 24, 26, 28]}
benchmark: buy_and_hold
primary_metric: sharpe
registered_at: 2026-09-30
notes_on_prior_trials: >
  DEMO ONLY: this spec runs on the simulated demo universe (scripts/build_demo_world.py), not on
  market data, to populate the dashboard. None: independent of H-0001.
